<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chronical Moshers – Kasse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0909">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Vereinsschrift "Night Warrior" (Pixel Sagas, Freeware). Liegt als eigene
     Datei neben der App und wird vom Service Worker mit vorgehalten - sie
     funktioniert also auch ohne Netz. Fehlt sie, greift Archivo Black. */
  @font-face{
    font-family:'Night Warrior';
    src:url("night-warrior.ttf") format("truetype");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  /* Chronical-Moshers-Palette: Schwarz und Blutrot. Die Variablennamen stammen
     noch aus der Imbiss-Fassung und bleiben, damit nicht jede Stelle im Code
     angefasst werden muss - --mustard ist jetzt die helle Akzentfarbe (Rot),
     --paprika das dunkle Rot fuer Flaechen. */
  :root{
    --bg:#0e0909;
    --panel:#160d0d;
    --panel-2:#221414;
    --paper:#f2e8d6;
    --paper-line:#ddccaa;
    --ink:#241a15;
    --mustard:#d1202f;
    --mustard-dark:#9e1622;
    --paprika:#8f1414;
    --paprika-dark:#650e0e;
    --basil:#4f7a3f;
    --cream-text:#f2e6da;
    --dim:#a9917f;
    /* Warntext auf dunklem Grund. --paprika ist dafuer zu dunkel und waere
       auf den Kacheln kaum lesbar. */
    --warn-text:#ff5c64;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--cream-text);font-family:'Work Sans',sans-serif;overflow:hidden;}
  html,body{background:radial-gradient(ellipse at 50% 0%, #2a1111 0%, #0e0909 55%);}
  #app{display:flex;height:100vh;height:100dvh;width:100vw;}

  /* ---------- LEFT: menu board ---------- */
  #board{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;flex-wrap:wrap;gap:10px;}
  #brand{display:flex;align-items:center;gap:12px;min-width:0;}
  #brand-logo{width:56px;height:64px;flex-shrink:0;color:var(--cream-text);filter:drop-shadow(0 0 6px rgba(209,32,47,0.45));}
  #shop-title{font-family:'Night Warrior','Archivo Black',sans-serif;font-size:28px;line-height:1;letter-spacing:1px;color:var(--mustard);text-transform:uppercase;white-space:nowrap;}
  #shop-sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-top:5px;}
  #powered{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--dim);letter-spacing:0.5px;white-space:nowrap;}
  #powered img{width:18px;height:18px;border-radius:4px;display:block;flex-shrink:0;}
  #daily{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid #3a2020;border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none;}
  #daily:active{transform:scale(0.98);}
  #daily .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
  #daily .amount{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--cream-text);font-size:15px;}
  .topbar-btn{background:none;border:1px solid #4a2b2b;color:var(--dim);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Work Sans',sans-serif;}
  .topbar-btn:active{background:var(--panel-2);}
  .topbar-badge{position:absolute;top:-4px;right:-4px;background:var(--paprika);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
  .topbar-btn.alert{background:var(--paprika);border:2px solid #fff;color:#fff;font-weight:900;animation:pulse-alert 1.1s ease-in-out infinite;transform-origin:center;}
  .topbar-btn.alert .topbar-badge{background:#fff;color:var(--paprika-dark);border:1px solid var(--paprika-dark);}
  @keyframes pulse-alert{
    0%,100%{box-shadow:0 0 0 0 rgba(209,32,47,0.9); transform:scale(1);}
    50%{box-shadow:0 0 0 12px rgba(209,32,47,0); transform:scale(1.12);}
  }

  #cats{display:flex;gap:8px;padding:6px 18px 12px;overflow-x:auto;flex-shrink:0;}
  #cats::-webkit-scrollbar{display:none;}
  .cat-pill{flex-shrink:0;padding:9px 16px;border-radius:999px;background:var(--panel-2);border:1px solid #3a2020;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .cat-pill.active{background:var(--mustard);color:#fff;border-color:var(--mustard);}

  #grid-wrap{flex:1;overflow-y:auto;padding:4px 18px 24px;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;}
  .product-card{background:var(--panel-2);border:1px solid #3a2020;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .08s ease;}
  .product-card:active{transform:scale(0.94);background:#331f1f;}
  .product-emoji{font-size:30px;line-height:1;}
  /* Produktnamen, Preise und der ganze Bon stehen in der Vereinsschrift.
     Sie hat nur einen Schnitt - font-weight:normal verhindert, dass der
     Browser einen unschoenen Fett-Schnitt dazurechnet. */
  .product-name{font-family:'Night Warrior','Archivo Black',sans-serif;font-weight:normal;letter-spacing:0.5px;font-size:17px;line-height:1.1;text-align:center;color:var(--cream-text);}
  .product-price{font-family:'Night Warrior','Archivo Black',sans-serif;font-weight:normal;letter-spacing:0.5px;font-size:18px;color:var(--mustard);}
  .product-pfand{font-family:'Night Warrior','Archivo Black',sans-serif;font-weight:normal;letter-spacing:0.5px;font-size:12px;color:var(--dim);margin-top:-3px;}
  /* Pfand-Knopf wird rot, solange mehr Pfand kassiert als zurueckgegeben wurde.
     Bewusst ohne Betrag: Der steht hinter der PIN beim Tagesumsatz. */
  .topbar-btn.pfand-offen{background:var(--paprika);border-color:var(--mustard);color:#fff;font-weight:700;}
  .empty-msg{color:var(--dim);font-size:14px;padding:30px 0;text-align:center;}

  /* ---------- RIGHT: receipt (always visible, compact) ---------- */
  #receipt{width:285px;flex-shrink:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;position:relative;}
  #receipt::before{content:"";display:block;height:14px;flex-shrink:0;background:
     radial-gradient(circle at 8px 7px, var(--bg) 6px, transparent 7px) repeat-x;
     background-size:16px 14px;}
  #receipt-head{padding:4px 14px 6px;text-align:center;border-bottom:1px dashed var(--paper-line);flex-shrink:0;}
  #receipt-logo{display:block;width:34px;height:39px;margin:0 auto 2px;color:var(--ink);}
  #receipt-head .rname{font-family:'Night Warrior','Archivo Black',sans-serif;font-size:17px;letter-spacing:1px;text-transform:uppercase;color:var(--paprika);}
  #receipt-head .rtime{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8a7d68;margin-top:2px;}
  /* "+ Gast" steht bewusst AUSSERHALB der Bon-Leiste und ist damit immer
     sichtbar, egal wie viele Bons offen sind. Vorher lief die Leiste seitlich
     und schob den Knopf hinaus, sobald ein Verkauf abgeschlossen war - dass man
     dort wischen kann, sieht man ihr nicht an, die Gast-Bons waren praktisch
     unauffindbar. Die Bons selbst brechen um und scrollen bei Bedarf senkrecht. */
  #tab-area{display:flex;flex-direction:column;gap:6px;padding:6px 10px;flex-shrink:0;border-bottom:1px dashed var(--paper-line);}
  #tab-row{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow-y:auto;}
  #tab-row::-webkit-scrollbar{display:none;}
  #tab-add{align-self:flex-start;}
  .tab-chip{flex-shrink:0;display:flex;align-items:center;gap:4px;background:#efe6d2;border:1px solid #d9cba9;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:#5c4f3d;cursor:pointer;white-space:nowrap;}
  .tab-chip.active{background:var(--paprika);border-color:var(--paprika);color:#fff;}
  .tab-chip.schnellverkauf{background:#f7dbd5;border-color:#e2ab9d;color:#8a2f1f;}
  .tab-chip.schnellverkauf.active{background:var(--paprika);border-color:var(--paprika-dark);color:#fff;}
  .tab-chip.last-order{background:#dbe8f5;border-color:#a9c9e0;color:#264b73;}
  .tab-chip.last-order.active{background:#3a6ea5;border-color:#2c5580;color:#fff;}
  .tab-chip.guest-active{background:#e91e8c;border-color:#c2157a;color:#fff;animation:pulse-guest 1.3s ease-in-out infinite;}
  .tab-chip.guest-active.active{background:#c2157a;border-color:#9e1164;color:#fff;animation:none;}
  @keyframes pulse-guest{0%,100%{box-shadow:0 0 0 0 rgba(233,30,140,0.65);}50%{box-shadow:0 0 0 8px rgba(233,30,140,0);}}
  .tab-chip .tc-x{margin-left:2px;opacity:0.75;font-size:12px;}
  .tab-chip-add{flex-shrink:0;background:#e5efdf;border:1px dashed #7f9a6c;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:#4a6338;cursor:pointer;}
  .tab-chip-add:active{background:#d3e3c9;}
  #cart-lines{flex:1;overflow-y:auto;padding:8px 14px;font-family:'Night Warrior','Archivo Black',sans-serif;font-weight:normal;letter-spacing:0.5px;font-size:16px;}
  .cart-empty{color:#8a7d68;text-align:center;padding:30px 0;font-family:'Work Sans',sans-serif;font-size:12px;}
  .cart-line{display:flex;align-items:center;gap:5px;padding:7px 0;border-bottom:1px dotted var(--paper-line);}
  .cl-name{flex:1;min-width:0;white-space:normal;word-break:break-word;}
  .cl-qtybox{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  /* Tippziel fuer einen Finger auf dem Tablet - vorher 18x18 px und damit
     kaum treffsicher zu bedienen. */
  .cl-btn{width:32px;height:32px;border-radius:8px;border:1px solid #c9bc9e;background:#efe6d2;color:var(--ink);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .cl-btn:active{background:#e0d4b7;}
  .cl-qty{width:20px;text-align:center;font-size:18px;}
  /* Breit genug fuer zweistellige Betraege ohne Umbruch (z. B. "14,00 EUR"). */
  .cl-price{width:66px;text-align:right;flex-shrink:0;white-space:nowrap;}
  .cart-line.pfand-line{color:#8a7d68;}
  /* Gleiche Breite wie die +/- Knoepfe darueber, damit Name und Betrag buendig stehen. */
  .cart-line.pfand-line .cl-qtybox{width:90px;justify-content:center;}
  #receipt-totals{padding:8px 14px 4px;border-top:1px dashed var(--paper-line);font-family:'Night Warrior','Archivo Black',sans-serif;font-weight:normal;letter-spacing:0.5px;flex-shrink:0;}
  .trow{display:flex;justify-content:space-between;font-size:15px;padding:2px 0;color:#5c4f3d;}
  .trow.gesamt{font-size:23px;color:var(--ink);padding-top:4px;}
  #receipt-actions{padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  #clear-btn{background:none;border:1px solid #c9bc9e;color:#7a6c54;border-radius:9px;padding:9px 10px;font-size:12px;cursor:pointer;font-family:'Work Sans',sans-serif;}
  #pay-btn{background:var(--basil);color:#fff;border:none;border-radius:9px;padding:11px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Work Sans',sans-serif;}
  #pay-btn:disabled{background:#a8b39d;cursor:not-allowed;}
  #pay-btn:active:not(:disabled){filter:brightness(0.92);}
  #version-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none;margin-left:4px;}

  /* ---------- modals ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal{background:var(--panel);width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;}
  @media(min-width:640px){.modal{border-radius:18px;}}
  .modal h2{font-family:'Archivo Black',sans-serif;font-size:17px;margin:0 0 14px;color:var(--mustard);text-transform:uppercase;letter-spacing:0.5px;}
  .modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;text-transform:uppercase;letter-spacing:0.5px;}
  .modal input, .modal select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #4a2b2b;background:var(--panel-2);color:var(--cream-text);font-size:15px;font-family:'Work Sans',sans-serif;}
  .modal-row{display:flex;gap:10px;}
  .modal-row > *{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-primary{flex:1;background:var(--mustard);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;}
  .btn-secondary{background:none;border:1px solid #4a2b2b;color:var(--dim);border-radius:10px;padding:13px 16px;cursor:pointer;font-size:14px;}
  .close-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;}

  .emoji-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:160px;overflow-y:auto;background:var(--panel-2);border:1px solid #4a2b2b;border-radius:9px;padding:8px;}
  .emoji-choice{font-size:20px;text-align:center;padding:6px 0;border-radius:7px;cursor:pointer;border:1px solid transparent;}
  .emoji-choice.selected{background:var(--mustard);border-color:var(--mustard);}
  .emoji-choice:active{background:#3a2020;}
  .product-manage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #331f1f;}
  .pmr-emoji{font-size:22px;width:30px;text-align:center;}
  .pmr-info{flex:1;min-width:0;}
  .pmr-name{font-weight:600;font-size:14px;}
  .pmr-sub{font-size:12px;color:var(--dim);}
  .pmr-actions{display:flex;gap:6px;}
  .icon-btn{background:var(--panel-2);border:1px solid #3a2020;color:var(--cream-text);border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer;}
  .icon-btn.danger{color:var(--warn-text);}

  .inv-row{padding:10px 0;border-bottom:1px solid #331f1f;}
  .inv-row.low{background:rgba(209,32,47,0.12);border-radius:8px;padding:10px 8px;margin:2px 0;}
  .inv-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .inv-name{flex:1;font-weight:600;font-size:14px;min-width:0;}
  .inv-warn{color:var(--warn-text);font-size:11px;font-weight:700;flex-shrink:0;}
  .inv-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .inv-fields label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;margin:0 0 3px;text-align:center;}
  .inv-fields input{width:100%;padding:7px 4px;font-size:13px;text-align:center;border-radius:7px;border:1px solid #4a2b2b;background:var(--panel-2);color:var(--cream-text);}
  .inv-restock{display:flex;gap:6px;}
  .inv-restock input{flex:1;padding:7px 8px;font-size:13px;border-radius:7px;border:1px solid #4a2b2b;background:var(--panel-2);color:var(--cream-text);}
  .inv-restock button{flex-shrink:0;background:var(--basil);color:#fff;border:none;border-radius:7px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .inv-cat-section{margin-top:8px;}
  .inv-cat-header{display:flex;align-items:center;gap:8px;padding:11px 4px;cursor:pointer;border-bottom:1px solid #331f1f;}
  .inv-cat-header span:last-child{font-size:13px;font-weight:700;color:var(--mustard);text-transform:uppercase;letter-spacing:0.5px;flex:1;}
  .inv-cat-count{font-size:11px;color:var(--dim);font-weight:600;background:var(--panel-2);border-radius:999px;padding:2px 8px;}
  .inv-cat-chevron{color:var(--dim);font-size:12px;width:12px;}
  .inv-cat-body{padding:2px 0 4px;}

  /* numpad */
  .numpad-display{background:var(--panel-2);border:1px solid #4a2b2b;border-radius:12px;padding:16px;text-align:right;margin-bottom:14px;}
  .numpad-display .given{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;color:var(--cream-text);}
  .numpad-display .change-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
  .numpad-display .change{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--basil);}
  .quick-amounts{display:flex;gap:8px;margin-bottom:12px;}
  .quick-amounts button{flex:1;background:var(--panel-2);border:1px solid #4a2b2b;color:var(--cream-text);border-radius:9px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .quick-amounts button:active{background:#331f1f;}
  .numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .numgrid button{background:var(--panel-2);border:1px solid #4a2b2b;color:var(--cream-text);border-radius:10px;padding:16px 0;font-size:19px;font-weight:600;cursor:pointer;}
  .numgrid button:active{background:#331f1f;}

  .loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:14px;}

  @media(max-width:640px){
    #receipt{width:175px;}
    .cart-line{flex-wrap:wrap;}
    .cl-name{flex:1 0 100%;order:-1;margin-bottom:5px;}
    .cl-btn{width:30px;height:30px;font-size:17px;}
    .cl-price{width:42px;flex:1;}
    #shop-title{font-size:17px;white-space:normal;}
    #brand-logo{width:38px;height:44px;}
    #brand{gap:8px;}
    .topbar-btn{padding:8px 10px;font-size:11px;}
    .product-card{padding:10px 6px;}
    .product-emoji{font-size:24px;}
    #grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
    #cats{padding:6px 10px 10px;}
    #topbar{padding:10px 10px 6px;}
    #grid-wrap{padding:4px 10px 20px;}
  }

  /* Pfand-Rueckgabe: grosse Tippziele, es wird im Stehen am Tresen gezaehlt */
  .pfand-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #331f1f;}
  .pfand-row .pmr-info{flex:1;}
  .pfand-stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .pfand-stepper button{width:48px;height:48px;border-radius:10px;border:1px solid #4a2b2b;background:var(--panel-2);color:var(--cream-text);font-size:24px;line-height:1;cursor:pointer;}
  .pfand-stepper button:active{background:#331f1f;}
  .pfand-stepper .menge{min-width:32px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;}
  .pfand-bilanz{margin-top:10px;padding-top:8px;border-top:1px dashed #4a2b2b;text-align:left;}
  .pfand-bilanz .zeile{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--dim);padding:2px 0;}
  .pfand-bilanz .zeile.offen{color:var(--cream-text);font-weight:700;}

  /* confirm dialog */
  .confirm-modal{max-width:320px;text-align:center;}
  .confirm-modal p{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 6px;}
  .confirm-modal .confirm-name{color:var(--cream-text);font-weight:700;}
</style>
</head>
<body>
<!-- Vereinslogo "Manni" (Chronical Moshers Metalclub Reichenbach, est. 1982).
     Aus der Illustrator-Vorlage Manni_CM_Logo_est1982 als Vektor uebernommen,
     einfarbig: Die Farbe kommt ueber currentColor vom jeweiligen Einsatzort -

function fmt(n){ return sichereZahl(n, 0).toFixed(2).replace(".",",") + " €"; }

/* Geldbetraege ueber Cent rechnen. Summiert man Fliesskommazahlen ueber einen
   ganzen Tag, entstehen sonst Werte wie 123.45000000000002 - die Anzeige rundet
   das zwar weg, der gespeicherte Tagesumsatz driftet aber mit. */
function inCent(betrag){ return Math.round(sichereZahl(betrag, 0) * 100); }
function ausCent(cent){ return cent / 100; }
function geldSumme(){
  let cent = 0;
  for(const betrag of arguments) cent += inCent(betrag);
  return ausCent(cent);
}
function postenSumme(einzelpreis, menge){
  return ausCent(inCent(einzelpreis) * Math.round(sichereZahl(menge, 0)));
}

/* Alle Schluessel beginnen mit "moshers:", nicht mit "kasse:" wie in der
   Imbiss-Kasse. Beide Kassen laufen auf GitHub Pages unter derselben Domain
   (ostelai.github.io), und localStorage gehoert zur Domain, nicht zum Pfad.
   Mit gleichen Schluesseln wuerden sie sich gegenseitig Produkte, Umsaetze und
   PIN ueberschreiben. Nicht zurueck auf "kasse:" aendern. */
function storageGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){
    console.error("Lesen fehlgeschlagen", key, e);
    return fallback;
  }
}
function storageSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error("Speichern fehlgeschlagen", key, e);
    showToast("Speichern fehlgeschlagen – Speicher des Geräts prüfen");
    return false;
  }
}

let toastTimer = null;
function showToast(message){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--paprika);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,0.4);max-width:90vw;text-align:center;";
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 4000);
}

/* ---------- PIN fuer die Umsatzansichten ----------
   Schuetzt gegen Blicke ueber die Schulter - Kunden am Tresen, Aushilfen.
   Nicht gegen jemanden, der das Geraet in der Hand hat und sich auskennt: Die
   Daten liegen im Browser des Tablets und sind dort einsehbar. Genau dieser
   beilaeufige Schutz ist hier aber der Zweck. */
const PIN_LAENGE = 4;
const PIN_ENTSPERRT_MS = 2 * 60 * 1000;   // nach der Eingabe 2 Minuten offen
let pinEntsperrtBis = 0;
let pinEingabe = "";
let pinZweiteEingabe = null;   // beim Festlegen: erste Eingabe zum Vergleich
let pinFolgeAktion = null;     // was nach erfolgreicher Eingabe passieren soll

function pinEntsperrt(){
  return Date.now() < pinEntsperrtBis;
}
function pinGesetzt(){
  return typeof storageGet("moshers:pin", null) === "string";
}
async function pinPruefsumme(pin){
  const text = "kasse-pin:" + pin;
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    const puffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(puffer)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  /* Notbehelf, wenn Web-Crypto fehlt (etwa beim Oeffnen direkt von der
     Festplatte). Schuetzt nur vor beilaeufigem Mitlesen im Speicher. */
  let h = 0;
  for(let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return "einfach:" + (h >>> 0).toString(16);
}

/* Fuehrt eine Aktion aus, sobald die PIN stimmt. Ist noch keine PIN vergeben,
   wird sie zuerst festgelegt. */
function mitPin(aktion){
  if(pinEntsperrt()){ aktion(); return; }
  pinEingabe = "";
  pinFolgeAktion = aktion;
  if(pinGesetzt()) pinAbfrageAnzeigen();
  else pinFestlegenAnzeigen();
}

function pinPunkte(){
  let anzeige = "";
  for(let i = 0; i < PIN_LAENGE; i++) anzeige += (i < pinEingabe.length ? "●" : "○") + " ";
  return anzeige.trim();
}
function pinAnzeigeAuffrischen(fehlertext){
  const punkte = document.getElementById("pin-punkte");
  if(punkte) punkte.textContent = pinPunkte();
  const fehler = document.getElementById("pin-fehler");
  if(fehler) fehler.textContent = fehlertext || "";
}

function pinTastenHtml(){

  tasten += `<button onclick="pinLoeschen()">⌫</button>`;
  tasten += `<button onclick="pinZiffer('0')">0</button>`;
  tasten += `<button onclick="closeModal()" style="font-size:14px;">Abbruch</button>`;
  return tasten;
}
function pinFensterHtml(titel, hinweis){
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:300px;">
        <h2>${escapeHtml(titel)}</h2>

        <div class="numpad-display" style="text-align:center;">

          <div id="pin-fehler" style="color:var(--warn-text);font-size:12px;min-height:17px;margin-top:4px;"></div>
        </div>

  `;
}

function pinAbfrageAnzeigen(){
  pinEingabe = "";
  document.getElementById("modal-root").innerHTML =
    pinFensterHtml("PIN eingeben", "Zum Anzeigen der Umsätze.");
}
function pinFestlegenAnzeigen(){
  pinEingabe = "";
  pinZweiteEingabe = null;
  document.getElementById("modal-root").innerHTML =
    pinFensterHtml("PIN festlegen", "Vierstellig. Sie schützt die Umsatzansichten vor fremden Blicken.");
}

function pinZiffer(ziffer){
  if(pinEingabe.length >= PIN_LAENGE) return;
  pinEingabe += ziffer;
  pinAnzeigeAuffrischen();
  if(pinEingabe.length === PIN_LAENGE) setTimeout(pinAbschliessen, 120);
}
function pinLoeschen(){
  pinEingabe = pinEingabe.slice(0, -1);
  pinAnzeigeAuffrischen();
}

async function pinAbschliessen(){
  const eingabe = pinEingabe;
  pinEingabe = "";
  if(pinGesetzt() && pinZweiteEingabe === null){
    const gespeichert = storageGet("moshers:pin", null);
    if(await pinPruefsumme(eingabe) === gespeichert){
      pinEntsperrtBis = Date.now() + PIN_ENTSPERRT_MS;
      updateDailyDisplay();
      const aktion = pinFolgeAktion;
      pinFolgeAktion = null;
      closeModal();
      if(aktion) aktion();
    } else {
      pinAnzeigeAuffrischen("Falsche PIN.");
    }
    return;
  }
  /* Festlegen: erst eingeben, dann zur Bestaetigung wiederholen. */
  if(pinZweiteEingabe === null){
    pinZweiteEingabe = eingabe;
    document.getElementById("modal-root").innerHTML =
      pinFensterHtml("PIN wiederholen", "Zur Sicherheit noch einmal dieselbe PIN.");
    return;
  }
  if(pinZweiteEingabe !== eingabe){
    pinZweiteEingabe = null;
    document.getElementById("modal-root").innerHTML =
      pinFensterHtml("PIN festlegen", "Die Eingaben waren verschieden. Bitte noch einmal.");
    return;
  }
  await storageSet("moshers:pin", await pinPruefsumme(eingabe));
  pinZweiteEingabe = null;
  pinEntsperrtBis = Date.now() + PIN_ENTSPERRT_MS;
  updateDailyDisplay();
  const aktion = pinFolgeAktion;
  pinFolgeAktion = null;
  closeModal();
  showToast("PIN gespeichert");
  if(aktion) aktion();
}

/* Reihenfolge der Kacheln in der "Alle"-Ansicht.
   Sortiert wird weiterhin nach Gesamtverkaeufen, aber die Reihenfolge wird
   bewusst nur zu festen Zeitpunkten neu bestimmt: beim Start, beim
   Tagesabschluss und wenn sich der Produktbestand aendert. Frueher wurde nach
   jedem abgeschlossenen Verkauf neu sortiert - dadurch verschoben sich die
   Kacheln mitten im Betrieb unter dem Finger. */
let rangfolge = {};   // productId -> Platz
function rangfolgeNeuBestimmen(){
  rangfolge = {};
  products.slice()
    .sort((a,b)=>(totalSales[b.id]||0) - (totalSales[a.id]||0))
    .forEach((p,i)=>{ rangfolge[p.id] = i; });
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let list = products.filter(p => activeCategory==="Alle" || p.category===activeCategory);
  if(activeCategory==="Alle"){
    list = list.slice().sort((a,b) => {
      const ra = rangfolge[a.id], rb = rangfolge[b.id];
      /* Produkte, die es beim letzten Festlegen noch nicht gab, kommen ans
         Ende - bis die Rangfolge das naechste Mal neu bestimmt wird. */
      if(ra === undefined && rb === undefined) return a.name.localeCompare(b.name, "de");
      if(ra === undefined) return 1;
      if(rb === undefined) return -1;
      return ra - rb;
    });
  } else {
    list = list.slice().sort((a,b) => a.name.localeCompare(b.name, "de"));
  }
  if(list.length===0){
    grid.innerHTML = '<div class="empty-msg">Keine Produkte in dieser Kategorie.<br>Tippe oben auf "Produkte verwalten".</div>';
    return;
  }
  list.forEach(p=>{
    const card = document.createElement("div");
    card.className = "product-card";
    const pfand = pfandArt(p.pfandId);
    card.innerHTML = `<div class="product-emoji">${productIconHtml(p,34)}</div><div class="product-name">${escapeHtml(p.name)}</div><div class="product-price">${fmt(p.price)}</div>`
      + (pfand ? `<div class="product-pfand">+ ${fmt(pfand.amount)} Pfand</div>` : "");
    card.onclick = ()=> addToCart(p.id);
    grid.appendChild(card);
  });
}

function renderTabs(){
  const wrap = document.getElementById("tab-row");
  wrap.innerHTML = "";
  tabs.forEach(t=>{
    const qty = Object.values(t.items).reduce((a,b)=>a+b,0);
    const chip = document.createElement("div");
    let cls = "tab-chip" + (t.id===activeTabId ? " active":"");
    if(t.id==="default") cls += " schnellverkauf";
    if(t.id!=="default" && qty>0) cls += " guest-active";
    chip.className = cls;
    let label = escapeHtml(t.name) + (qty>0 ? ` (${qty})` : "");
    if(t.id!=="default") label += ' <span class="tc-x">✕</span>';
    chip.innerHTML = label;
    chip.onclick = (e)=>{
      if(t.id!=="default" && e.target.classList.contains("tc-x")){ deleteTab(t.id); return; }
      switchTab(t.id);
    };
    wrap.appendChild(chip);
    if(t.id==="default" && lastCompletedOrder){
      const lo = document.createElement("div");
      lo.className = "tab-chip last-order" + (activeTabId==="last-order" ? " active":"");
      lo.textContent = "🕓 Letzte Bestellung";
      lo.onclick = ()=>{ switchTab("last-order"); };
      wrap.appendChild(lo);
    }
  });
  const nameEl = document.getElementById("receipt-name");
  if(nameEl){
    if(activeTabId==="last-order") nameEl.textContent = "🕓 Letzte Bestellung";
    else nameEl.textContent = getActiveTab().name === "Schnellverkauf" ? "Bon" : getActiveTab().name;
  }
}
function switchTab(id){
  activeTabId = id;
  if(id !== "last-order") saveTabs();
  renderTabs();
  renderCart();
}

function createTab(){
  const name = document.getElementById("f-tab-name").value.trim();
  if(!name){ alert("Bitte einen Namen eingeben."); return; }
  const id = "t" + Date.now();
  tabs.push({id, name, items:{}});
  activeTabId = id;
  saveTabs();
  renderTabs();
  renderCart();
  closeModal();
}
function deleteTab(id){
  const t = tabs.find(x=>x.id===id);
  if(!t) return;
  const qty = Object.values(t.items).reduce((a,b)=>a+b,0);
  const msg = qty>0
    ? `Der Bon <span class="confirm-name">${escapeHtml(t.name)}</span> enthält noch ${qty} Artikel, die nicht bezahlt wurden. Trotzdem löschen?`
    : `Bon <span class="confirm-name">${escapeHtml(t.name)}</span> wirklich löschen?`;
  showConfirm("Bon löschen?", msg, "Löschen", ()=>{
    tabs = tabs.filter(x=>x.id!==id);
    if(activeTabId===id) activeTabId = "default";
    saveTabs();
    renderTabs();
    renderCart();
  });
}

function renderCart(){
  const wrap = document.getElementById("cart-lines");
  const payBtn = document.getElementById("pay-btn");
  const clearBtn = document.getElementById("clear-btn");

  if(activeTabId === "last-order"){
    payBtn.textContent = "Bereits bezahlt";
    payBtn.disabled = true;
    clearBtn.style.display = "none";
    const order = lastCompletedOrder;
    if(!order || Object.keys(order.items).length===0){
      wrap.innerHTML = '<div class="cart-empty">Keine vergangene Bestellung vorhanden.</div>';
    } else {
      wrap.innerHTML = "";
      Object.keys(order.items).forEach(id=>{
        const p = products.find(x=>x.id===id);
        const qty = order.items[id];
        const line = document.createElement("div");
        line.className = "cart-line";
        line.innerHTML = `
          <div class="cl-qtybox"><span class="cl-qty" style="width:auto;padding:0 4px;font-weight:700;">${qty}×</span></div>
          <div class="cl-name">${p ? escapeHtml(p.name) : '(gelöschtes Produkt)'}</div>
          <div class="cl-price">${p ? fmt(postenSumme(p.price, qty)) : ''}</div>
        `;
        wrap.appendChild(line);
      });
      if(inCent(order.pfand) > 0){
        const line = document.createElement("div");
        line.className = "cart-line pfand-line";
        line.innerHTML = `
          <div class="cl-qtybox"></div>
          <div class="cl-name">Pfand</div>
          <div class="cl-price">${fmt(order.pfand)}</div>
        `;
        wrap.appendChild(line);
      }
    }
    const pfandDerBestellung = order ? order.pfand : 0;
    zeigeSummen(geldSumme(order ? order.total : 0, -pfandDerBestellung), pfandDerBestellung);
    return;
  }

  payBtn.textContent = "Kasse";
  clearBtn.style.display = "";
  const tab = getActiveTab();
  const ids = Object.keys(tab.items).filter(id=>tab.items[id]>0);
  if(ids.length===0){
    wrap.innerHTML = '<div class="cart-empty">Warenkorb ist leer.<br>Tippe links auf ein Produkt.</div>';
  } else {
    wrap.innerHTML = "";
    ids.forEach(id=>{
      const p = products.find(x=>x.id===id);
      if(!p) return;
      const qty = tab.items[id];
      const line = document.createElement("div");
      line.className = "cart-line";
      line.innerHTML = `
        <div class="cl-qtybox">
          <button class="cl-btn" onclick="decreaseQty('${id}')">−</button>
          <span class="cl-qty">${qty}</span>
          <button class="cl-btn" onclick="increaseQty('${id}')">+</button>
        </div>
        <div class="cl-name">${escapeHtml(p.name)}</div>
        <div class="cl-price">${fmt(postenSumme(p.price, qty))}</div>
      `;
      wrap.appendChild(line);
    });
    /* Pfand als eigene Zeilen je Pfandart - so sieht der Gast, wofuer er zahlt,
       und am Tresen ist klar, wie viele Becher rausgehen. */
    const aufstellung = pfandAufstellung(tab);
    Object.keys(aufstellung).forEach(pfandId=>{
      const art = pfandArt(pfandId);
      const menge = aufstellung[pfandId];
      const line = document.createElement("div");
      line.className = "cart-line pfand-line";
      line.innerHTML = `
        <div class="cl-qtybox"><span class="cl-qty" style="width:auto;">${menge}×</span></div>
        <div class="cl-name">Pfand ${escapeHtml(art.name)}</div>
        <div class="cl-price">${fmt(postenSumme(art.amount, menge))}</div>
      `;
      wrap.appendChild(line);
    });
  }
  const waren = warenSumme(tab);
  const pfand = pfandSumme(tab);
  zeigeSummen(waren, pfand);
  payBtn.disabled = geldSumme(waren, pfand) <= 0;
}

/* Zwischensumme und Pfand nur zeigen, wenn wirklich Pfand im Bon ist - sonst
   stehen drei Zeilen mit demselben Betrag untereinander. */
function zeigeSummen(waren, pfand){
  const mitPfand = inCent(pfand) > 0;
  document.getElementById("subtotal-row").style.display = mitPfand ? "flex" : "none";
  document.getElementById("pfand-row").style.display = mitPfand ? "flex" : "none";
  document.getElementById("subtotal-amount").textContent = fmt(waren);
  document.getElementById("pfand-amount").textContent = fmt(pfand);
  document.getElementById("total-amount").textContent = fmt(geldSumme(waren, pfand));
}

function pfandArt(id){
  return (id && pfandTypes.find(pt=>pt.id===id)) || null;
}
/* Summe der Waren ohne Pfand - das ist der Umsatz. */
function warenSumme(tab){
  const cent = Object.keys(tab.items).reduce((summe,id)=>{
    const p = products.find(x=>x.id===id);
    return p ? summe + inCent(p.price) * tab.items[id] : summe;
  },0);
  return ausCent(cent);
}
/* pfandId -> Anzahl Pfandstuecke im Bon */
function pfandAufstellung(tab){
  const aufstellung = {};
  Object.keys(tab.items).forEach(id=>{
    const p = products.find(x=>x.id===id);
    if(!p || !pfandArt(p.pfandId) || !(tab.items[id] > 0)) return;
    aufstellung[p.pfandId] = (aufstellung[p.pfandId]||0) + tab.items[id];
  });
  return aufstellung;
}
function pfandSumme(tab){
  const aufstellung = pfandAufstellung(tab);
  const cent = Object.keys(aufstellung).reduce((summe,pfandId)=>
    summe + inCent(pfandArt(pfandId).amount) * aufstellung[pfandId], 0);
  return ausCent(cent);
}
/* Zu zahlender Betrag: Waren plus Pfand. */
function getTotal(){
  const tab = getActiveTab();
  return geldSumme(warenSumme(tab), pfandSumme(tab));
}

function addToCart(id){
  if(activeTabId === "last-order") activeTabId = "default";
  const tab = getActiveTab();
  tab.items[id] = (tab.items[id]||0) + 1;
  saveTabs();
  renderTabs();
  renderCart();
}
function increaseQty(id){
  const tab = getActiveTab();
  tab.items[id] = (tab.items[id]||0)+1;
  saveTabs();
  renderTabs();
  renderCart();
}
function decreaseQty(id){
  const tab = getActiveTab();
  if(!tab.items[id]) return;
  tab.items[id] -= 1;
  if(tab.items[id]<=0) delete tab.items[id];
  saveTabs();
  renderTabs();
  renderCart();
}
function clearCart(){
  if(activeTabId === "last-order") return;
  getActiveTab().items = {};
  saveTabs();
  renderTabs();
  renderCart();
}

/* ---------- Daten pruefen ----------
   Alles, was aus einer Sicherungsdatei oder aus dem localStorage kommt, ist
   erstmal unbekannt. Diese Bausteine bringen jeden Wert in eine Form, mit der
   die App sicher umgehen kann - statt darauf zu vertrauen, dass er stimmt. */
const ID_MUSTER = /^[A-Za-z0-9_-]{1,64}$/;
function neueId(praefix){
  return praefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function sichereId(wert, praefix){
  const t = String(wert === null || wert === undefined ? "" : wert);
  /* Kennungen landen in onclick-Attributen. Ein Apostroph darin waere ein
     Ausbruch aus der Zeichenkette, deshalb nur unverfaengliche Zeichen. */
  return ID_MUSTER.test(t) ? t : neueId(praefix);
}
function sichererText(wert, maxLaenge){
  return String(wert === null || wert === undefined ? "" : wert).trim().slice(0, maxLaenge || 80);
}
function sichereZahl(wert, ersatz){
  const n = typeof wert === "number" ? wert : parseFloat(wert);
  return Number.isFinite(n) ? n : ersatz;
}
function sicheresBild(wert){
  const t = typeof wert === "string" ? wert : "";
  /* Nur das Format, das die App selbst erzeugt (Canvas -> Data-URL). */
  return /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=\s]+$/.test(t) && t.length < 700000 ? t : null;
}
function sicheresIcon(wert, ersatz){
  const t = String(wert === null || wert === undefined ? "" : wert).trim();
  return (t && [...t].length <= 4) ? t : ersatz;
}
function sicheresLager(roh){
  const sauber = {};
  Object.keys(roh && typeof roh === "object" ? roh : {}).forEach(id=>{
    const e = roh[id];
    if(!e || typeof e !== "object") return;
    /* Unbrauchbare Schluessel verwerfen statt umbenennen: Eine neue Kennung
       zeigt auf kein Produkt und kaeme bei jedem Start erneut hinzu. */
    if(!ID_MUSTER.test(id)) return;
    const kennung = id;
    const schwelle = (e.threshold === null || e.threshold === undefined || e.threshold === "")
      ? null : sichereZahl(e.threshold, null);
    sauber[kennung] = {
      stock: Math.max(0, sichereZahl(e.stock, 0)),
      target: sichereZahl(e.target, 0),
      threshold: schwelle
    };
  });
  return sauber;
}
function sichereZaehler(roh){
  const sauber = {};
  Object.keys(roh && typeof roh === "object" ? roh : {}).forEach(id=>{
    if(!ID_MUSTER.test(id)) return;          // siehe sicheresLager()
    const menge = sichereZahl(roh[id], 0);
    if(menge > 0) sauber[id] = menge;
  });
  return sauber;
}
function sichereBons(roh){
  const liste = Array.isArray(roh) ? roh : [];
  const bons = [];
  liste.forEach(t=>{
    if(!t || typeof t !== "object") return;
    const name = sichererText(t.name, 40);
    if(!name) return;
    /* "default" ist der feste Schnellverkauf-Bon und darf seine Kennung behalten. */
    const id = t.id === "default" ? "default" : sichereId(t.id, "t");
    if(bons.some(b=>b.id === id)) return;
    bons.push({ id, name, items: sichereZaehler(t.items) });
  });
  if(!bons.some(b=>b.id === "default")){
    bons.unshift({id:"default", name:"Schnellverkauf", items:{}});
  }
  return bons;
}

/* Bringt einen kompletten Datensatz in einen benutzbaren Zustand und meldet,
   wie viele Eintraege dabei verworfen werden mussten. Wird sowohl beim Start
   als auch beim Einlesen einer Sicherung verwendet - damit ein bereits
   gespeicherter Schaden beim naechsten Start von selbst ausheilt. */
/* Uebertraegt einen geprueften Datensatz in die laufende App. */
function datensatzUebernehmen(d){
  products = d.products;
  categories = d.categories;
  supplies = d.supplies;
  inventory = d.inventory;
  dayHistory = d.dayHistory;
  pfandTypes = d.pfandTypes;
  pfandCollected = d.pfandCollected;
  pfandReturned = d.pfandReturned;
  dailyTotal = d.dailyTotal;
  dailySales = d.dailySales;
  totalSales = d.totalSales;
  tabs = d.tabs;
  activeTabId = d.activeTabId;
  lastCompletedOrder = d.lastCompletedOrder;
}

/* Schreibt den kompletten aktuellen Stand zurueck. */
async function datensatzSichern(){
  await storageSet("moshers:products", products);
  await storageSet("moshers:categories", categories);
  await storageSet("moshers:supplies", supplies);
  await storageSet("moshers:inventory", inventory);
  await storageSet("moshers:day-history", dayHistory);
  await storageSet("moshers:pfand-types", pfandTypes);
  await storageSet("moshers:pfand-collected", pfandCollected);
  await storageSet("moshers:pfand-returned", pfandReturned);
  await storageSet("moshers:daily-total", dailyTotal);
  await storageSet("moshers:daily-sales", dailySales);
  await storageSet("moshers:total-sales", totalSales);
  await storageSet("moshers:last-completed-order", lastCompletedOrder);
  saveTabs();
}

function datensatzPruefen(roh){
  let verworfen = 0;

  const kategorien = [];
  (Array.isArray(roh.categories) ? roh.categories : []).forEach(c=>{
    const name = sichererText(c, 40);
    if(name && !kategorien.includes(name)) kategorien.push(name);
  });
  if(kategorien.length === 0) kategorien.push(...DEFAULT_CATEGORIES);

  /* Pfandarten vor den Produkten pruefen - die Produkte verweisen darauf. */
  const pfandArten = [];
  (Array.isArray(roh.pfandTypes) ? roh.pfandTypes : []).forEach(pt=>{
    if(!pt || typeof pt !== "object"){ verworfen++; return; }
    const name = sichererText(pt.name, 40);
    const betrag = sichereZahl(pt.amount, null);
    if(!name || betrag === null || betrag < 0){ verworfen++; return; }
    let id = sichereId(pt.id, "pf");
    while(pfandArten.some(a=>a.id === id)) id = neueId("pf");
    pfandArten.push({ id, name, amount: betrag });
  });

  const produkte = [];
  const vergeben = new Set();
  (Array.isArray(roh.products) ? roh.products : []).forEach(pr=>{
    if(!pr || typeof pr !== "object"){ verworfen++; return; }
    const name = sichererText(pr.name, 60);
    const preis = sichereZahl(pr.price, null);
    /* Ohne Name oder Preis ist ein Produkt nicht verkaeufbar - und ein
       fehlender Preis liess frueher die Anzeige abstuerzen. */
    if(!name || preis === null || preis < 0){ verworfen++; return; }
    let id = sichereId(pr.id, "p");
    while(vergeben.has(id)) id = neueId("p");
    vergeben.add(id);
    produkte.push({
      id, name,
      price: preis,
      category: kategorien.includes(sichererText(pr.category, 40)) ? sichererText(pr.category, 40) : "Sonstiges",
      /* Faellt ein Produkt auf "Sonstiges" zurueck, muss es die Kategorie auch
         geben - aber nur dann. Sonst erschiene sie unaufgefordert in der Liste. */
      emoji: sicheresIcon(pr.emoji, EMOJI_CHOICES[0]),
      image: sicheresBild(pr.image),
      /* Verweist das Produkt auf eine Pfandart, die es nicht (mehr) gibt,
         faellt das Pfand weg, statt ins Leere zu zeigen. */
      pfandId: pfandArten.some(a=>a.id === pr.pfandId) ? pr.pfandId : null
    });
  });

  if(produkte.some(pr=>pr.category === "Sonstiges") && !kategorien.includes("Sonstiges")){
    kategorien.push("Sonstiges");
  }

  const material = [];
  (Array.isArray(roh.supplies) ? roh.supplies : []).forEach(v=>{
    if(!v || typeof v !== "object"){ verworfen++; return; }
    const name = sichererText(v.name, 60);
    if(!name){ verworfen++; return; }
    let id = sichereId(v.id, "s");
    while(vergeben.has(id)) id = neueId("s");
    vergeben.add(id);
    material.push({ id, name, emoji: sicheresIcon(v.emoji, "\u{1F9F4}") });
  });

  const verlauf = [];
  (Array.isArray(roh.dayHistory) ? roh.dayHistory : []).forEach(d=>{
    if(!d || typeof d !== "object"){ verworfen++; return; }
    const bezeichnung = sichererText(d.label, 40);
    if(!bezeichnung){ verworfen++; return; }
    verlauf.push({
      date: sichererText(d.date, 10),
      label: bezeichnung,
      total: sichereZahl(d.total, 0),
      sales: sichereZaehler(d.sales),
      pfandCollected: Math.max(0, sichereZahl(d.pfandCollected, 0)),
      pfandReturned: Math.max(0, sichereZahl(d.pfandReturned, 0))
    });
  });

  const bons = sichereBons(roh.tabs);
  let letzteBestellung = null;
  if(roh.lastCompletedOrder && typeof roh.lastCompletedOrder === "object"){
    letzteBestellung = {
      items: sichereZaehler(roh.lastCompletedOrder.items),
      total: sichereZahl(roh.lastCompletedOrder.total, 0),
      pfand: Math.max(0, sichereZahl(roh.lastCompletedOrder.pfand, 0)),
      tabName: sichererText(roh.lastCompletedOrder.tabName, 40),
      completedAt: sichererText(roh.lastCompletedOrder.completedAt, 30)
    };
  }

  return {
    verworfen,
    daten: {
      products: produkte,
      categories: kategorien,
      pfandTypes: pfandArten,
      pfandCollected: Math.max(0, sichereZahl(roh.pfandCollected, 0)),
      pfandReturned: Math.max(0, sichereZahl(roh.pfandReturned, 0)),
      supplies: material,
      inventory: sicheresLager(roh.inventory),
      dayHistory: verlauf.slice(0, 400),
      dailyTotal: Math.max(0, sichereZahl(roh.dailyTotal, 0)),
      dailySales: sichereZaehler(roh.dailySales),
      totalSales: sichereZaehler(roh.totalSales),
      tabs: bons,
      activeTabId: bons.some(b=>b.id === roh.activeTabId) ? roh.activeTabId : "default",
      lastCompletedOrder: letzteBestellung
    }
  };
}

function productIconHtml(p, size){
  size = size || 22;
  /* Nur selbst erzeugte Bild-Daten zulassen. Ein beliebiger Wert aus einer
     Sicherungsdatei koennte sonst aus dem src-Attribut ausbrechen. */
  const bild = sicheresBild(p.image);
  if(bild){
    return `<img src="${escapeHtml(bild)}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:${Math.round(size/4)}px;flex-shrink:0;display:inline-block;vertical-align:middle;">`;
  }
  return escapeHtml(sicheresIcon(p.emoji, "\u2b50"));
}
/* Ersetzt auch Anfuehrungszeichen - sonst schuetzt die Funktion zwar Text,
   aber keine Attributwerte wie src="..." oder value="...". Genau daran hing
   eine Luecke: Ein " im Wert brach das Attribut auf. */
function escapeHtml(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ---------- Zahlung ---------- */
function openPay(){
  payGivenStr = "";
  const tab = getActiveTab();
  const total = getTotal();
  const modal = document.getElementById("modal-root");
  modal.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">✕</button>
        <h2>Kasse${tab.id!=="default" ? " · "+escapeHtml(tab.name) : ""}</h2>
        <div class="numpad-display">
          <div style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;">Gesamt: ${fmt(total)}</div>
          <div class="given" id="given-display">0,00 €</div>
          <div class="change-label">Rückgeld</div>
          <div class="change" id="change-display">0,00 €</div>
        </div>
        <div class="quick-amounts" id="quick-amounts"></div>
        <div class="numgrid">
          <button onclick="numInput('1')">1</button><button onclick="numInput('2')">2</button><button onclick="numInput('3')">3</button>
          <button onclick="numInput('4')">4</button><button onclick="numInput('5')">5</button><button onclick="numInput('6')">6</button>
          <button onclick="numInput('7')">7</button><button onclick="numInput('8')">8</button><button onclick="numInput('9')">9</button>
          <button onclick="numInput(',')">,</button><button onclick="numInput('0')">0</button><button onclick="numBackspace()">⌫</button>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
          <button class="btn-primary" id="confirm-pay-btn" onclick="confirmPay()">Verkauf abschließen</button>
        </div>
      </div>
    </div>
  `;
  const quickWrap = document.getElementById("quick-amounts");
  const quicks = [total, 5, 10, 20, 50].filter((v,i,arr)=> v>0 && arr.indexOf(v)===i);
  quickWrap.innerHTML = "";
  quicks.slice(0,4).forEach(v=>{
    const btn = document.createElement("button");
    btn.textContent = v===total ? "Passend" : v+" €";
    btn.onclick = ()=>{ payGivenStr = v.toFixed(2).replace(".",","); updatePayDisplay(); };
    quickWrap.appendChild(btn);
  });
  updatePayDisplay();
}
function numInput(ch){
  if(ch===',' && payGivenStr.includes(',')) return;
  if(payGivenStr.includes(',')){
    const decimals = payGivenStr.split(',')[1];
    if(decimals && decimals.length>=2) return;
  }
  payGivenStr += ch;
  updatePayDisplay();
}
function numBackspace(){ payGivenStr = payGivenStr.slice(0,-1); updatePayDisplay(); }

function updatePayDisplay(){
  const given = parseFloat(payGivenStr.replace(',','.')) || 0;
  const total = getTotal();
  const change = given - total;
  document.getElementById("given-display").textContent = fmt(given);
  const changeEl = document.getElementById("change-display");
  changeEl.textContent = fmt(Math.abs(change));
  changeEl.style.color = change < 0 ? "var(--warn-text)" : "var(--basil)";
  document.getElementById("confirm-pay-btn").disabled = false;
}

async function confirmPay(){
  const tab = getActiveTab();
  const waren = warenSumme(tab);
  const pfand = pfandSumme(tab);
  const total = geldSumme(waren, pfand);
  /* Nur die Waren zaehlen zum Umsatz. Das Pfand gehoert dem Gast und geht bei
     der Rueckgabe wieder raus. */
  dailyTotal = geldSumme(dailyTotal, waren);
  pfandCollected = geldSumme(pfandCollected, pfand);
  Object.keys(tab.items).forEach(id=>{
    dailySales[id] = (dailySales[id]||0) + tab.items[id];
    totalSales[id] = (totalSales[id]||0) + tab.items[id];
    inventory[id] = inventory[id] || {stock:0, target:0, threshold:null};
    /* Nicht ins Minus laufen lassen: "-2 Currywurst" gibt es nicht und stiftet
       bei der Inventur nur Verwirrung. Wer mehr verkauft als eingetragen war,
       korrigiert das "Ist" ohnehin beim naechsten Zaehlen. */
    inventory[id].stock = Math.max(0, inventory[id].stock - tab.items[id]);
  });
  lastCompletedOrder = { items: {...tab.items}, total, pfand, tabName: tab.name, completedAt: new Date().toISOString() };
  await storageSet("moshers:last-completed-order", lastCompletedOrder);
  await storageSet("moshers:pfand-collected", pfandCollected);
  await storageSet("moshers:daily-total", dailyTotal);
  await storageSet("moshers:daily-sales", dailySales);
  await storageSet("moshers:total-sales", totalSales);
  await storageSet("moshers:inventory", inventory);
  updateDailyDisplay();
  updateInventoryBadge();
  if(tab.id === "default"){
    tab.items = {};
  } else {
    tab.items = {}; // Gast-Bon bleibt bestehen (für wiederkehrende Gäste) - wird nur geleert, nicht gelöscht
    activeTabId = "default";
  }
  saveTabs();
  renderTabs();
  renderCart();
  /* Bewusst kein renderGrid() mehr: Am Raster aendert sich durch einen Verkauf
     nichts ausser der Rangfolge - und genau die soll waehrend des Betriebs
     stehen bleiben. Spart nebenbei einen kompletten Neuaufbau pro Verkauf. */
  closeModal();
}

function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

let pendingConfirmAction = null;

function runPendingConfirm(){
  const action = pendingConfirmAction;

}

/* Kassiertes, zurueckgegebenes und offenes Pfand. Liegt nur in Ansichten
   hinter der PIN - aus dem kassierten Pfand liesse sich sonst auf die Zahl der
   verkauften Getraenke schliessen. */
function pfandBilanzHtml(kassiert, zurueck){
  if(inCent(kassiert) === 0 && inCent(zurueck) === 0) return "";
  const offen = geldSumme(kassiert, -zurueck);
  return `
    <div class="pfand-bilanz">
      <div class="zeile"><span>Pfand kassiert</span><span>${fmt(kassiert)}</span></div>
      <div class="zeile"><span>Pfand zurückgegeben</span><span>${fmt(zurueck)}</span></div>
      <div class="zeile offen"><span>${inCent(offen) < 0 ? "Mehr zurückgegeben" : "Pfand offen"}</span><span>${fmt(Math.abs(offen))}</span></div>
    </div>
  `;
}

async function resetDaily(){
  /* Nur ein Hinweis, keine Sperre: Auf einem mehrtaegigen Fest kommen Becher
     auch erst am naechsten Tag zurueck. */
  const offen = pfandOffen();
  if(inCent(offen) > 0){
    showConfirm(
      "Offenes Pfand",
      `Es sind noch <span class="confirm-name">${fmt(offen)}</span> Pfand nicht zurückgegeben. Tag trotzdem abschließen?`,
      "Trotzdem abschließen",
      ()=>tagAbschliessen()
    );
    return;
  }
  await tagAbschliessen();
}
async function tagAbschliessen(){
  if(dailyTotal > 0 || Object.keys(dailySales).length > 0 || inCent(pfandCollected) > 0 || inCent(pfandReturned) > 0){
    const now = new Date();
    dayHistory.unshift({
      date: now.toISOString().slice(0,10),
      label: now.toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"}),
      total: dailyTotal,
      sales: {...dailySales},
      pfandCollected,
      pfandReturned
    });
    /* Rund ein Jahr statt zwei Monate: Ein Imbiss-Stand laeuft saisonal, der
     Vergleich mit dem Vorjahr ist damit ueberhaupt erst moeglich. Der Platz
     dafuer ist zu vernachlaessigen - ein Tag sind ein paar hundert Byte. */
  dayHistory = dayHistory.slice(0, 400);
    await storageSet("moshers:day-history", dayHistory);
  }
  dailyTotal = 0;
  dailySales = {};
  pfandCollected = 0;
  pfandReturned = 0;
  await storageSet("moshers:daily-total", 0);
  await storageSet("moshers:daily-sales", {});
  await storageSet("moshers:pfand-collected", 0);
  await storageSet("moshers:pfand-returned", 0);
  updateDailyDisplay();
  /* Zum Tagesabschluss darf sich die Reihenfolge neu einpendeln - da steht
     niemand am Tresen und wartet. */
  rangfolgeNeuBestimmen();
  renderGrid();
  closeModal();
}

function openPfandReturn(){

  const zeilen = pfandTypes.map(pt=>`

function pfandRueckgabeBetrag(){
  const cent = pfandTypes.reduce((summe,pt)=> summe + inCent(pt.amount) * (pfandRueckgabe[pt.id]||0), 0);
  return ausCent(cent);
}
/* Aendert nur Zahl und Betrag, statt das Fenster neu aufzubauen - so bleibt
   beim schnellen Tippen jeder Finger auf seinem Knopf. */
function pfandRueckgabeAendern(pfandId, schritt){
  if(!pfandArt(pfandId)) return;
  pfandRueckgabe[pfandId] = Math.max(0, (pfandRueckgabe[pfandId]||0) + schritt);
  const menge = document.getElementById("pfand-menge-" + pfandId);
  if(menge) menge.textContent = pfandRueckgabe[pfandId];
  const betrag = pfandRueckgabeBetrag();
  const anzeige = document.getElementById("pfand-auszahlung");
  if(anzeige) anzeige.textContent = fmt(betrag);
  const knopf = document.getElementById("pfand-auszahlen-btn");
  if(knopf) knopf.disabled = inCent(betrag) <= 0;
}
async function confirmPfandReturn(){
  const betrag = pfandRueckgabeBetrag();
  if(inCent(betrag) <= 0) return;
  pfandReturned = geldSumme(pfandReturned, betrag);
  pfandRueckgabe = {};
  await storageSet("moshers:pfand-returned", pfandReturned);
  updatePfandButton();
  closeModal();
  showToast("Pfand ausgezahlt: " + fmt(betrag));
}

/* ---------- Produktverwaltung ---------- */
/* ---------- Inventur & Einkaufsliste ---------- */
/* Ein Schwellwert gilt nur dann als gesetzt, wenn das Feld nicht leer ist.
   Eine eingetragene 0 ist ausdruecklich ein Schwellwert: dann wird gewarnt,
   sobald nichts mehr da ist. Frueher galt 0 als "nicht gesetzt" - dadurch
   hat "Warnen ab 0" nie gewarnt. */
function schwelleGesetzt(inv){
  return !!inv && inv.threshold !== null && inv.threshold !== undefined && inv.threshold !== "";
}
function isLowStock(id){
  const inv = inventory[id];
  if(!schwelleGesetzt(inv)) return false;
  return inv.stock <= inv.threshold;
}

/* Einmalige Umstellung fuer Geraete, auf denen schon Daten liegen.
   Dort steht bei jedem je verkauften Artikel threshold: 0 - aber nicht, weil
   es jemand eingetragen hat, sondern weil 0 der automatische Startwert war.
   Wuerde man die 0 jetzt als Schwellwert werten, ploppte schlagartig fuer
   fast jedes Produkt eine Warnung auf. Diese Altbestaende werden daher
   einmalig auf "nicht gesetzt" gestellt. Danach zaehlt eine eingetragene 0. */
function altnullenAufNichtGesetzt(lager){
  Object.keys(lager || {}).forEach(id=>{
    if(lager[id] && lager[id].threshold === 0) lager[id].threshold = null;
  });
  return lager;
}
async function schwellenwerteUmstellen(){
  if(storageGet("moshers:schwelle-migriert-v1", false)) return;
  altnullenAufNichtGesetzt(inventory);
  await storageSet("moshers:inventory", inventory);
  await storageSet("moshers:schwelle-migriert-v1", true);
}
function updateInventoryBadge(){
  const lowCount = [...products, ...supplies].filter(x=>isLowStock(x.id)).length;
  [["inventory-btn"],["shopping-btn"]].forEach(([btnId])=>{
    const btn = document.getElementById(btnId);
    if(!btn) return;
    const existing = btn.querySelector(".topbar-badge");
    if(existing) existing.remove();
    if(lowCount>0){
      const badge = document.createElement("span");
      badge.className = "topbar-badge";
      badge.textContent = lowCount;
      btn.appendChild(badge);
    }
  });
  const shopBtn = document.getElementById("shopping-btn");
  if(shopBtn) shopBtn.classList.toggle("alert", lowCount>0);
}
let invOpenSections = {}; // merkt sich pro Abschnitt, ob er aufgeklappt ist - bleibt über Re-Renders hinweg erhalten
let invAbschnittsSchluessel = {}; // sectionId -> stabiler Schluessel

/* Der Aufklapp-Zustand haengt am Namen des Abschnitts, nicht an seiner Position.
   Frueher war "inv-2" der Schluessel - wurde eine Kategorie geloescht oder
   verschoben, klappte danach die falsche auf. Die sectionId bleibt trotzdem
   eine reine Positionsangabe, weil sie in ein onclick-Attribut geschrieben wird
   und dort kein frei gewaehlter Text stehen darf. */
function abschnittsSchluessel(sectionId, catName){
  return String(sectionId).split("-")[0] + "|" + catName;
}
function renderCollapsibleSection(catName, countLabel, innerHtml, sectionId, defaultOpen){
  const schluessel = abschnittsSchluessel(sectionId, catName);
  invAbschnittsSchluessel[sectionId] = schluessel;
  const isOpen = Object.prototype.hasOwnProperty.call(invOpenSections, schluessel) ? invOpenSections[schluessel] : defaultOpen;
  return `
    <div class="inv-cat-section">
      <div class="inv-cat-header" onclick="toggleSection('${sectionId}')">
        <span class="inv-cat-chevron" id="chev-${sectionId}">${isOpen ? '▾' : '▸'}</span>
        <span>${escapeHtml(catName)}</span>
        <span class="inv-cat-count">${countLabel}</span>
      </div>
      <div class="inv-cat-body" id="body-${sectionId}" style="display:${isOpen ? 'block':'none'};">
        ${innerHtml}
      </div>
    </div>
  `;
}
function toggleSection(sectionId){
  const body = document.getElementById("body-"+sectionId);
  const chev = document.getElementById("chev-"+sectionId);
  const isOpen = body.style.display !== "none";
  body.style.display = isOpen ? "none" : "block";
  chev.textContent = isOpen ? "▸" : "▾";
  invOpenSections[invAbschnittsSchluessel[sectionId] || sectionId] = !isOpen;
}

function deleteSupply(id){

  if(!s) return;
  showConfirm(
    "Artikel löschen?",
    `Soll <span class="confirm-name">${escapeHtml(s.name)}</span> wirklich gelöscht werden?`,

    async ()=>{
      supplies = supplies.filter(x=>x.id!==id);
      delete inventory[id];
      await storageSet("moshers:supplies", supplies);
      await storageSet("moshers:inventory", inventory);
      updateInventoryBadge();
      showInventoryModal();
    }
  );

/* Frischt genau eine Zeile der Inventur auf, statt das ganze Fenster neu zu
   bauen. Vorher rief jede Eingabe showInventoryModal() - dabei sprang die Liste
   an den Anfang zurueck, der Fokus ging verloren, und ein direkt folgender
   Fingertipp landete auf einem Element, das es schon nicht mehr gab. */
function aktualisiereLagerZeile(id){
  const zeile = document.getElementById("invrow-" + id);
  if(!zeile) return;
  const knapp = isLowStock(id);
  zeile.classList.toggle("low", knapp);
  const warnung = document.getElementById("warn-" + id);
  if(warnung) warnung.style.display = knapp ? "" : "none";
  const istFeld = document.getElementById("ist-" + id);
  /* Das Feld nicht ueberschreiben, solange jemand darin tippt. */
  if(istFeld && document.activeElement !== istFeld){
    istFeld.value = (inventory[id] && inventory[id].stock) || 0;
  }
  aktualisiereInventurZaehler();
}

/* Zaehler in den Kategorie-Ueberschriften ("5 | 2 knapp") neu berechnen.
   Zaehlt direkt die Zeilen im Fenster - so bleibt die Logik an einer Stelle. */
function aktualisiereInventurZaehler(){
  document.querySelectorAll(".inv-cat-section").forEach(abschnitt=>{
    const zaehler = abschnitt.querySelector(".inv-cat-count");
    const koerper = abschnitt.querySelector(".inv-cat-body");
    if(!zaehler || !koerper) return;
    const alle = koerper.querySelectorAll(".inv-row").length;
    if(alle === 0) return;
    const knapp = koerper.querySelectorAll(".inv-row.low").length;
    zaehler.textContent = knapp > 0 ? alle + " · ⚠ " + knapp : String(alle);
  });
}

async function updateInventoryField(id, field, value){
  const roh = String(value).trim();
  let v;
  if(field === "threshold" && roh === ""){
    v = null;                                  // leeres Feld = fuer diesen Artikel nicht warnen
  } else {
    v = parseFloat(roh);
    if(isNaN(v)) v = (field === "threshold") ? null : 0;
  }
  inventory[id] = inventory[id] || {stock:0, target:0, threshold:null};
  inventory[id][field] = v;
  await storageSet("moshers:inventory", inventory);
  updateInventoryBadge();
  aktualisiereLagerZeile(id);
}
async function addRestock(id){
  const input = document.getElementById("restock-"+id);
  const qty = parseFloat(input.value);
  if(isNaN(qty) || qty<=0) return;
  inventory[id] = inventory[id] || {stock:0, target:0, threshold:null};
  inventory[id].stock += qty;
  await storageSet("moshers:inventory", inventory);
  input.value = "";                 // damit dieselbe Menge nicht versehentlich doppelt gebucht wird
  updateInventoryBadge();
  aktualisiereLagerZeile(id);
}

        <div class="inv-row low" id="shoprow-${p.id}">
          <div class="inv-top">
            <span style="font-size:18px;">${productIconHtml(p,20)}</span>
            <div class="inv-name">${escapeHtml(p.name)}</div>
            <span class="inv-warn">Ist ${sichereZahl(inv.stock, 0)} &middot; Warnen ab ${sichereZahl(inv.threshold, 0)}</span>
          </div>
          <div class="inv-restock">
            <input type="number" id="shop-restock-${p.id}" placeholder="Menge gekauft">
            <button onclick="addRestockFromShopping('${p.id}')">+ Erhalten</button>
          </div>
        </div>
      `;
    }).join("");
    return renderCollapsibleSection(cat, String(items.length), itemRows, "shop-"+i, true);
  }).join("");
  const lowSupplies = supplies.filter(s=>isLowStock(s.id)).sort((a,b)=>a.name.localeCompare(b.name,"de"));
  let suppliesSection = "";
  if(lowSupplies.length>0){
    const supplyRows = lowSupplies.map(s=>{
      const inv = inventory[s.id] || {stock:0, target:0, threshold:null};
      return `
        <div class="inv-row low" id="shoprow-${s.id}">
          <div class="inv-top">
            <span style="font-size:18px;">${escapeHtml(sicheresIcon(s.emoji, "\u{1F9F4}"))}</span>
            <div class="inv-name">${escapeHtml(s.name)}</div>
            <span class="inv-warn">Ist ${sichereZahl(inv.stock, 0)} &middot; Warnen ab ${sichereZahl(inv.threshold, 0)}</span>
          </div>
          <div class="inv-restock">
            <input type="number" id="shop-restock-${s.id}" placeholder="Menge gekauft">
            <button onclick="addRestockFromShopping('${s.id}')">+ Erhalten</button>
          </div>
        </div>
      `;
    }).join("");
    suppliesSection = renderCollapsibleSection("🧰 Verbrauchsmaterial", String(lowSupplies.length), supplyRows, "shop-supplies", true);
  }
  modal.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">✕</button>
        <h2>🛒 Einkaufsliste</h2>
        <p style="color:var(--dim);font-size:13px;margin:-8px 0 12px;">Automatisch erzeugt aus der Inventur – zeigt alles, was den Warn-Schwellwert erreicht hat.</p>
        ${sections}${suppliesSection}
        ${(!sections && !suppliesSection) ? '<div class="empty-msg">Aktuell muss nichts nachbestellt werden. 🎉</div>' : ''}
      </div>
    </div>
  `;
}
async function addRestockFromShopping(id){
  const input = document.getElementById("shop-restock-"+id);
  const qty = parseFloat(input.value);
  if(isNaN(qty) || qty<=0) return;
  inventory[id] = inventory[id] || {stock:0, target:0, threshold:null};
  inventory[id].stock += qty;
  await storageSet("moshers:inventory", inventory);
  updateInventoryBadge();
  /* Erledigte Zeile herausnehmen, statt die Liste neu aufzubauen - sonst
     springt sie beim Abarbeiten staendig an den Anfang zurueck. */
  const zeile = document.getElementById("shoprow-" + id);
  if(zeile && !isLowStock(id)){
    const abschnitt = zeile.closest(".inv-cat-section");
    zeile.remove();
    if(abschnitt && abschnitt.querySelectorAll(".inv-row").length === 0) abschnitt.remove();
    aktualisiereInventurZaehler();
    const fenster = document.querySelector("#modal-root .modal");
    if(fenster && fenster.querySelectorAll(".inv-row").length === 0){
      const hinweis = document.createElement("div");
      hinweis.className = "empty-msg";
      hinweis.textContent = "Aktuell muss nichts nachbestellt werden. 🎉";
      fenster.appendChild(hinweis);
    }
  } else {
    input.value = "";
    aktualisiereLagerZeile(id);
  }
}

  modal.innerHTML = `

        <div class="modal-row" style="margin-bottom:10px;">

          <button class="btn-secondary" style="flex:0 0 auto;" onclick="addCategory()">+ Hinzufügen</button>
        </div>
        <label style="margin-top:18px;">Pfandarten</label>

        <div class="modal-row" style="margin-bottom:10px;">
          <input id="new-pfand-name" type="text" placeholder="z. B. Becher">
          <input id="new-pfand-amount" type="number" step="0.50" min="0" placeholder="2,00" style="flex:0 0 90px;">
          <button class="btn-secondary" style="flex:0 0 auto;" onclick="addPfandType()">+ Hinzufügen</button>

        ${pinGesetzt() ? `<div class="modal-actions">

        <input type="file" id="import-file" accept="application/json" style="display:none;" onchange="importData(event)">

function exportData(){
  const payload = {
    products, categories, pfandTypes, supplies, inventory,
    dayHistory, dailyTotal, dailySales, totalSales,
    pfandCollected, pfandReturned,
    tabs, activeTabId, lastCompletedOrder,
    /* Muss mit in die Sicherung: Ohne diesen Merker kann die Gegenseite nicht
       unterscheiden, ob ein "threshold: 0" bewusst gesetzt wurde oder noch der
       alte automatische Startwert ist. Fehlt er, gilt die Datei als alt. */
    schwelleMigriert: storageGet("moshers:schwelle-migriert-v1", false),
    /* Als Pruefsumme, nicht im Klartext. Muss mit, sonst steht sie nach einem
       Adresswechsel ohne PIN da - und die Umsatzansichten waeren offen. */
    pin: storageGet("moshers:pin", null),
    exportedAt: new Date().toISOString(), version: APP_VERSION
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "moshers-kasse-sicherung-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert("Diese Datei ist keine gültige Sicherungsdatei."); return; }
    if(!data || typeof data !== "object" || !Array.isArray(data.products) || !Array.isArray(data.categories)){
      alert("Diese Datei enthält keine gültigen Kassendaten.");
      return;
    }

    /* Erst vollstaendig pruefen, dann fragen, dann speichern. Frueher wurde
       zuerst gespeichert und danach angezeigt - eine beschaedigte Datei konnte
       die App dadurch unbenutzbar machen, und weil "Produkte verwalten" an
       derselben Stelle abstuerzte, kam man an den Import nicht mehr heran. */
    /* Sicherungen aus der Imbiss-Fassung kennen keine Pfandarten. Dann bleiben
       die Pfandarten dieses Geraets erhalten, statt still geloescht zu werden. */
    const mitPfandarten = Array.isArray(data.pfandTypes);
    const geprueft = datensatzPruefen(mitPfandarten ? data : Object.assign({}, data, {pfandTypes}));
    if(geprueft.daten.products.length === 0){
      alert("Diese Datei enthält kein einziges verwendbares Produkt.\n\nEs wurde nichts geändert.");
      return;
    }
    const hinweis = geprueft.verworfen > 0
      ? `<br><br>${geprueft.verworfen} Eintrag/Einträge in der Datei sind beschädigt und werden übersprungen.`
      : "";
    showConfirm(
      "Sicherung einlesen?",
      `Es werden ${geprueft.daten.products.length} Produkte, ${geprueft.daten.categories.length} Kategorien und ${geprueft.daten.pfandTypes.length} Pfandarten geladen, dazu Verbrauchsmaterial, Lagerbestand, Pfand, Wochenverlauf und offene Bons. Die aktuellen Daten auf diesem Gerät werden dabei überschrieben.${hinweis}`,
      "Überschreiben",
      async ()=>{
        datensatzUebernehmen(geprueft.daten);
        /* Sicherung aus einer Fassung vor der Schwellwert-Umstellung: Dort ist
           jedes "threshold: 0" ein automatischer Startwert, kein bewusst
           gesetzter Schwellwert. Wuerde man das uebernehmen, erschiene sofort
           fuer fast jedes Produkt eine Nachbestell-Warnung. */
        if(data.schwelleMigriert !== true) altnullenAufNichtGesetzt(inventory);
        if(typeof data.pin === "string") await storageSet("moshers:pin", data.pin);
        rangfolgeNeuBestimmen();
        await datensatzSichern();
        /* Nach dem Einlesen gilt die Umstellung als erledigt - egal aus welcher
           Fassung die Datei kam. Sonst liefe sie beim naechsten Start erneut und
           wuerde bewusst gesetzte Nullen wieder abschalten. */
        await storageSet("moshers:schwelle-migriert-v1", true);
        renderCategories();
        renderGrid();
        renderManageModal();
        renderTabs();
        renderCart();
        updateDailyDisplay();
        updateInventoryBadge();
      }
    );
  };
  reader.readAsText(file);
  event.target.value = "";
}
async function addPfandType(){
  const name = sichererText(document.getElementById("new-pfand-name").value, 40);
  const betrag = parseFloat(String(document.getElementById("new-pfand-amount").value).replace(",", "."));
  if(!name || isNaN(betrag) || betrag < 0){
    alert("Bitte einen Namen und einen gültigen Betrag für die Pfandart eingeben.");
    return;
  }
  pfandTypes.push({id: neueId("pf"), name, amount: betrag});
  await storageSet("moshers:pfand-types", pfandTypes);
  renderGrid();
  renderManageModal();
}
function deletePfandType(id){
  const art = pfandArt(id);
  if(!art) return;
  const inUse = products.filter(p=>p.pfandId===id).length;
  const msg = inUse>0
    ? `Die Pfandart <span class="confirm-name">${escapeHtml(art.name)}</span> wird von ${inUse} Produkt(en) verwendet. Diese werden danach ohne Pfand verkauft. Wirklich löschen?`
    : `Pfandart <span class="confirm-name">${escapeHtml(art.name)}</span> wirklich löschen?`;
  showConfirm("Pfandart löschen?", msg, "Löschen", async ()=>{
    pfandTypes = pfandTypes.filter(x=>x.id!==id);
    products.forEach(p=>{ if(p.pfandId===id) p.pfandId = null; });
    await storageSet("moshers:pfand-types", pfandTypes);
    await storageSet("moshers:products", products);
    renderGrid();
    renderCart();
    renderManageModal();
  });
}
async function addCategory(){
  const input = document.getElementById("new-cat-input");
  const name = input.value.trim();
  if(!name) return;
  if(categories.includes(name)){ input.value=""; return; }
  categories.push(name);
  await storageSet("moshers:categories", categories);
  renderCategories();
  renderManageModal();
}
function deleteCategory(index){
  /* Bewusst die Position statt des Namens: Ein Name mit Anfuehrungszeichen
     wuerde sonst das onclick-Attribut aufbrechen. */
  const cat = categories[index];
  if(cat === undefined) return;
  const inUse = products.filter(p=>p.category===cat).length;
  const msg = inUse>0
    ? `Die Kategorie <span class="confirm-name">${escapeHtml(cat)}</span> wird von ${inUse} Produkt(en) verwendet. Diese werden zu "Sonstiges" verschoben. Kategorie wirklich löschen?`
    : `Kategorie <span class="confirm-name">${escapeHtml(cat)}</span> wirklich löschen?`;
  showConfirm("Kategorie löschen?", msg, "Löschen", async ()=>{
    categories = categories.filter(c=>c!==cat);
    if(!categories.includes("Sonstiges")) categories.push("Sonstiges");
    products.forEach(p=>{ if(p.category===cat) p.category = "Sonstiges"; });
    await storageSet("moshers:categories", categories);
    await storageSet("moshers:products", products);
    if(activeCategory===cat) activeCategory="Alle";
    renderCategories();
    renderGrid();
    renderManageModal();
  });
}
function editProduct(id){ editingProductId = id; openProductForm(); }
function deleteProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  showConfirm(
    "Produkt löschen?",
    `Soll <span class="confirm-name">${escapeHtml(p.name)}</span> wirklich dauerhaft gelöscht werden?`,
    "Löschen",
    async ()=>{
      products = products.filter(x=>x.id!==id);
      delete inventory[id];
      await storageSet("moshers:products", products);
      await storageSet("moshers:inventory", inventory);
      rangfolgeNeuBestimmen();
      renderGrid();
      renderManageModal();
      updateInventoryBadge();
    }
  );
}

function openProductForm(){
  const p = editingProductId ? products.find(x=>x.id===editingProductId) : null;
  selectedEmoji = p ? p.emoji : EMOJI_CHOICES[0];
  selectedPhoto = p ? (p.image || null) : null;
  const modal = document.getElementById("modal-root");

    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">

        <select id="f-pfand">
          <option value="">Kein Pfand</option>

let selectedEmoji = EMOJI_CHOICES[0];
let selectedPhoto = null;
function renderPhotoPreview(){
  const wrap = document.getElementById("photo-preview");
  if(!wrap) return;
  wrap.innerHTML = selectedPhoto
    ? `<img src="${escapeHtml(sicheresBild(selectedPhoto) || "")}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #4a2b2b;">`
    : `<div style="color:var(--dim);font-size:12px;">Kein Foto ausgewählt – Icon wird verwendet.</div>`;
}
function handlePhotoSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxSize = 220;
      let w = img.width, h = img.height;
      if(w >= h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      selectedPhoto = canvas.toDataURL("image/jpeg", 0.78);
      renderPhotoPreview();
    };
    img.onerror = ()=>{ alert("Dieses Bild konnte nicht geladen werden."); };
    img.src = reader.result;
  };
  reader.onerror = ()=>{ alert("Foto konnte nicht gelesen werden."); };
  reader.readAsDataURL(file);
  event.target.value = "";
}
function removePhoto(){
  selectedPhoto = null;
  renderPhotoPreview();
}
function renderEmojiPicker(){
  const wrap = document.getElementById("emoji-picker");
  wrap.innerHTML = EMOJI_CHOICES.map(e=>
    `<div class="emoji-choice${e===selectedEmoji?' selected':''}" onclick="pickEmoji('${e}')">${e}</div>`
  ).join("");
}
function pickEmoji(e){
  selectedEmoji = e;
  renderEmojiPicker();
}
function toggleNewCategoryField(){
  const sel = document.getElementById("f-category");
  const field = document.getElementById("f-category-new");
  field.style.display = sel.value === "__new__" ? "block" : "none";
  if(sel.value === "__new__") field.focus();
}
async function saveProduct(){
  const name = document.getElementById("f-name").value.trim();
  const price = parseFloat(document.getElementById("f-price").value);
  const emoji = selectedEmoji;
  const pfandId = pfandArt(document.getElementById("f-pfand").value) ? document.getElementById("f-pfand").value : null;
  let category = document.getElementById("f-category").value;
  if(category === "__new__"){
    category = document.getElementById("f-category-new").value.trim();
    if(!category){
      alert("Bitte einen Namen für die neue Kategorie eingeben.");
      return;
    }
    if(!categories.includes(category)){
      categories.push(category);
      await storageSet("moshers:categories", categories);
      renderCategories();
    }
  }
  if(!name || isNaN(price) || price < 0){
    alert("Bitte Name und einen gültigen Preis eingeben.");
    return;
  }
  if(editingProductId){
    const p = products.find(x=>x.id===editingProductId);
    p.name = name; p.price = price; p.emoji = emoji; p.category = category; p.image = selectedPhoto; p.pfandId = pfandId;
  } else {
    /* Feldreihenfolge wie in datensatzPruefen(), damit zwei Sicherungsdateien
       desselben Standes auch als Text identisch sind und sich vergleichen lassen. */
    products.push({id:"p"+Date.now(), name, price, category, emoji, image: selectedPhoto, pfandId});
  }
  editingProductId = null;
  await storageSet("moshers:products", products);
  rangfolgeNeuBestimmen();
  renderCategories();
  renderGrid();
  openManage();
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(e=>console.error("Vollbild nicht möglich", e));
  } else {
    document.exitFullscreen();
  }
}

init();

/* ---------- Offline-Fähigkeit ----------
   Meldet den Service Worker an. Der hält die App-Dateien lokal vor, damit
   die Kasse auch ohne Netz startet. Schlägt die Anmeldung fehl (z. B. beim
   Öffnen der Datei direkt von der Festplatte statt über https), läuft die
   App unverändert weiter – nur eben ohne Offline-Reserve. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(e=>console.warn("Offline-Modus nicht verfügbar", e));
  });
}

/* Bittet den Browser, die Kassendaten dauerhaft zu behalten. Ohne diese
   Kennzeichnung darf der Browser den localStorage bei knappem Speicher
   von sich aus leeren – genau das soll hier nicht passieren.
   Der Aufruf ist unkritisch: Er liest oder verändert keine Daten. */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted()
    .then(schonDauerhaft => schonDauerhaft ? true : navigator.storage.persist())
    .catch(()=>{});
}
